<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Employee Login | SAJJAD HEALTH CARE</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      padding: 20px;
    }

    .login-box {
      width: 100%;
      max-width: 400px;
      background: white;
      padding: 35px 30px;
      border-radius: 20px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.3);
      text-align: center;
    }

    .logo {
      width: 75px;
      height: 75px;
      margin: 0 auto 15px;
      border-radius: 50%;
      background: #0d8f83;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      font-weight: bold;
    }

    h1 {
      color: #12343b;
      font-size: 24px;
      margin-bottom: 5px;
    }

    .subtitle {
      color: #777;
      font-size: 14px;
      margin-bottom: 28px;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-bottom: 15px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 15px;
      outline: none;
    }

    input:focus {
      border-color: #0d8f83;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #0d8f83;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #08756b;
    }

    #message {
      margin-top: 15px;
      font-size: 14px;
      font-weight: bold;
    }

    .footer {
      margin-top: 25px;
      font-size: 12px;
      color: #999;
    }
  </style>
</head>

<body>

  <div class="login-box">

    <div class="logo">SH</div>

    <h1>SAJJAD HEALTH CARE</h1>
    <p class="subtitle">Employee Portal</p>

    <form id="loginForm">

      <input
        type="text"
        id="employeeId"
        placeholder="Employee ID"
        required
      >

      <input
        type="password"
        id="password"
        placeholder="Password"
        required
      >

      <button type="submit">Employee Login</button>

    </form>

    <p id="message"></p>

    <div class="footer">
      Your health, our priority
    </div>

  </div>

  <script>
    document.getElementById("loginForm").addEventListener("submit", function(event) {

      event.preventDefault();

      const employeeId = document.getElementById("employeeId").value;
      const password = document.getElementById("password").value;
      const message = document.getElementById("message");

      /*
        DEMO LOGIN ONLY

        Change these values for testing.
      */

      if (employeeId === "EMP001" && password === "123456") {

        message.style.color = "green";
        message.textContent = "Login successful!";

        setTimeout(function() {
          window.location.href = "employee-dashboard.html";
        }, 800);

      } else {

        message.style.color = "red";
        message.textContent = "Invalid Employee ID or password.";

      }

    });
  </script>

</body>
</html>
