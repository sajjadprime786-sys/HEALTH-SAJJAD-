<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>SAJJAD HEALTH CARE - Employee Login</title>
<style>
*{box-sizing:border-box;font-family:Arial,sans-serif}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#062235,#0b5c7a);color:#14202b;padding:20px}
.card{background:#fff;border-radius:18px;padding:34px 28px;max-width:360px;width:100%;box-shadow:0 10px 30px #00000030}
.brand{text-align:center;margin-bottom:22px}
.brand h1{margin:0;font-size:21px;color:#062235}
.brand p{margin:5px 0 0;color:#667784;font-size:13px}
label{font-size:13px;font-weight:700;color:#0b4968;display:block;margin-bottom:5px}
input{width:100%;padding:12px;border:1px solid #ccd7df;border-radius:9px;margin-bottom:16px;font-size:15px}
button{width:100%;border:0;border-radius:10px;padding:13px;font-weight:700;font-size:15px;cursor:pointer;background:#087ea4;color:#fff}
button:active{background:#06607d}
.err{background:#fde8e8;color:#9b1c1c;padding:10px;border-radius:8px;font-size:13px;margin-bottom:14px;display:none}
.hint{text-align:center;margin-top:16px;font-size:12px;color:#8a99a5}
.lockout{background:#fff3cd;color:#7a5600;padding:10px;border-radius:8px;font-size:12px;margin-bottom:14px;display:none}
</style>
</head>
<body>
<div class="card">
  <div class="brand">
    <h1>SAJJAD HEALTH CARE</h1>
    <p>Employee Login</p>
  </div>
  <div class="err" id="err"></div>
  <div class="lockout" id="lockout"></div>
  <form id="loginForm">
    <label for="eid">Employee ID</label>
    <input type="text" id="eid" placeholder="e.g. EMP001" autocomplete="off" />
    <label for="pass">Password</label>
    <input type="password" id="pass" placeholder="Enter your password" autocomplete="off" />
    <button type="submit">Login</button>
  </form>
  <div class="hint">Contact your administrator if you forgot your password.</div>
</div>

<script>
/* ============================================================
   EMPLOYEE CREDENTIALS
   Add/edit employees here. Format: "ID": { password: "...", name: "..." }
   NOTE: These are visible to anyone who views this page's source code.
   This is fine for basic internal use, but not real security.
   ============================================================ */
const EMPLOYEES = {
  "EMP001": { password: "pass123", name: "Employee One" },
  "EMP002": { password: "pass456", name: "Employee Two" }
  // Add more employees below in the same format:
  // "EMP003": { password: "yourpassword", name: "Employee Name" },
};

const MAX_ATTEMPTS = 5;
const LOCKOUT_KEY = 'sajjad_login_attempts';

function getAttempts() {
  return JSON.parse(sessionStorage.getItem(LOCKOUT_KEY) || '{"count":0}');
}
function saveAttempts(data) {
  sessionStorage.setItem(LOCKOUT_KEY, JSON.stringify(data));
}
const EMPLOYEES = {
  "EMP001": { password: "pass123", name: "Employee One" },
  "EMP002": { password: "pass456", name: "Employee Two" }
};
document.getElementById('loginForm').addEventListener('submit', function (e) {
  e.preventDefault();
  const eid = document.getElementById('eid').value.trim().toUpperCase();
  const pass = document.getElementById('pass').value;
  const errBox = document.getElementById('err');
  const lockBox = document.getElementById('lockout');
  errBox.style.display = 'none';
  lockBox.style.display = 'none';

  const attempts = getAttempts();
  if (attempts.count >= MAX_ATTEMPTS) {
    lockBox.textContent = 'Too many failed attempts. Please refresh the page and try again later, or contact your administrator.';
    lockBox.style.display = 'block';
    return;
  }

  if (!eid || !pass) {
    errBox.textContent = 'Please enter both Employee ID and Password.';
    errBox.style.display = 'block';
    return;
  }

  const record = EMPLOYEES[eid];
  if (!record || record.password !== pass) {
    attempts.count = (attempts.count || 0) + 1;
    saveAttempts(attempts);
    const remaining = MAX_ATTEMPTS - attempts.count;
    errBox.textContent = remaining > 0
      ? `Incorrect Employee ID or Password. ${remaining} attempt(s) remaining.`
      : 'Incorrect Employee ID or Password. No attempts remaining.';
    errBox.style.display = 'block';
    return;
  }

  // Successful login
  saveAttempts({ count: 0 });
  sessionStorage.setItem('employeeId', eid);
  sessionStorage.setItem('employeeName', record.name);
  sessionStorage.setItem('employeeLoginTime', new Date().toISOString());
  window.location.href = 'employee-dashboard.html';
});
</script>
</body>
</html>
