<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Employee Dashboard | SAJJAD HEALTH CARE</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f4f7f8;
      color: #17343a;
    }

    header {
      background: #0d8f83;
      color: white;
      padding: 18px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 {
      font-size: 20px;
    }

    .logout {
      background: white;
      color: #0d8f83;
      border: none;
      padding: 9px 14px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }

    .container {
      max-width: 1100px;
      margin: auto;
      padding: 25px 18px;
    }

    .welcome {
      background: white;
      padding: 25px;
      border-radius: 16px;
      margin-bottom: 20px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.06);
    }

    .welcome h2 {
      margin-bottom: 8px;
    }

    .welcome p {
      color: #777;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 18px;
    }

    .card {
      background: white;
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.06);
    }

    .icon {
      font-size: 30px;
      margin-bottom: 12px;
    }

    .card h3 {
      margin-bottom: 8px;
    }

    .card p {
      color: #777;
      font-size: 14px;
    }

    .section {
      margin-top: 25px;
      background: white;
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.06);
    }

    .section h2 {
      margin-bottom: 18px;
    }

    .task {
      padding: 14px;
      border-left: 4px solid #0d8f83;
      background: #f5fafa;
      margin-bottom: 10px;
      border-radius: 6px;
    }

    footer {
      text-align: center;
      padding: 30px;
      color: #888;
      font-size: 13px;
    }
  </style>
</head>

<body>

<header>
  <h1>SAJJAD HEALTH CARE</h1>
  <button class="logout" onclick="logout()">Logout</button>
</header>

<div class="container">

  <div class="welcome">
    <h2>Welcome, Employee 👋</h2>
    <p>Employee ID: EMP001</p>
  </div>

  <div class="cards">

    <div class="card">
      <div class="icon">👤</div>
      <h3>My Profile</h3>
      <p>View your employee information.</p>
    </div>

    <div class="card">
      <div class="icon">📋</div>
      <h3>Tasks</h3>
      <p>View your assigned tasks.</p>
    </div>

    <div class="card">
      <div class="icon">🕐</div>
      <h3>Attendance</h3>
      <p>Check your attendance records.</p>
    </div>

    <div class="card">
      <div class="icon">💊</div>
      <h3>Health Records</h3>
      <p>Access authorized healthcare information.</p>
    </div>

  </
