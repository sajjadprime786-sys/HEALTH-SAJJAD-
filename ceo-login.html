<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SAJJAD HEALTH CARE - CEO Login</title>

<style>
* {
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    margin: 0;
    min-height: 100vh;
    background: linear-gradient(135deg, #062235, #0b4968);
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
}

.login-box {
    width: 90%;
    max-width: 420px;
    padding: 30px;
    background: rgba(255,255,255,0.12);
    border-radius: 22px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.35);
}

h1 {
    text-align: center;
    font-size: 30px;
    margin-bottom: 8px;
}

.subtitle {
    text-align: center;
    color: #b9d9e8;
    margin-bottom: 30px;
    font-size: 18px;
}

label {
    display: block;
    margin: 15px 0 7px;
    font-size: 15px;
}

input {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 10px;
    font-size: 16px;
    outline: none;
}

button {
    width: 100%;
    padding: 14px;
    margin-top: 25px;
    border: none;
    border-radius: 10px;
    background: #00bfff;
    color: white;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
}

button:active {
    transform: scale(0.98);
}

#message {
    text-align: center;
    margin-top: 15px;
    color: #ffaaaa;
}

.brand {
    text-align: center;
    margin-top: 25px;
    color: #a9c9d8;
    font-size: 13px;
}
</style>
</head>

<body>

<div class="login-box">

    <h1>SAJJAD HEALTH CARE</h1>

    <div class="subtitle">
        CEO Login Portal
    </div>

    <form id="loginForm">

        <label>CEO ID</label>
        <input
            type="text"
            id="ceoId"
            placeholder="Enter CEO ID"
            required
        >

        <label>Password</label>
        <input
            type="password"
            id="password"
            placeholder="Enter password"
            required
        >

        <button type="submit">
            CEO LOGIN
        </button>

        <div id="message"></div>

    </form>

    <div class="brand">
        CEO • SAJJAD HEALTH CARE
    </div>

</div>

<script>

const CEO_ID = "CEO001";
const CEO_PASSWORD = "CEO123456";

document.getElementById("loginForm").addEventListener("submit", function(event) {

    event.preventDefault();

    const id = document.getElementById("ceoId").value.trim();
    const password = document.getElementById("password").value;

    if (id === CEO_ID && password === CEO_PASSWORD) {

        sessionStorage.setItem("ceoLoggedIn", "true");
        sessionStorage.setItem("ceoId", id);

        window.location.href = "employee-dashboard.html";

    } else {

        document.getElementById("message").textContent =
            "Invalid CEO ID or password.";

    }

});

</script>

</body>
</html>
